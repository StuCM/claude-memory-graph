name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python tests (incl. retrieval benchmark)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest -q

  ceist:
    name: ceist (Arches outputs, matching layers, HER acceptance gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      # Alizarin reads the SKOS thesauri; the Rós Madair end-to-end tests skip
      # without its bindings and emitter (a long Rust build).
      - run: uv venv && uv pip install "./packages/ceist[vectors,onnx,roots]" alizarin pytest
      - run: .venv/bin/python -m pytest -q packages/ceist/tests
      # The project flow end to end on the real Arches HER models: read them
      # through Alizarin, assemble the committed vocabulary into a bundle, and
      # gate on the blind acceptance questions with the shipping config.
      - run: git clone --depth 1 https://github.com/archesproject/arches-her "$RUNNER_TEMP/arches-her"
      - name: HER acceptance gate
        run: |
          P="$RUNNER_TEMP/arches-her/arches_her/pkg"
          .venv/bin/ceist vocab describe "$P/graphs/resource_models" "$RUNNER_TEMP/her-models" --reference "$P/reference_data"
          .venv/bin/ceist vocab assemble "$RUNNER_TEMP/her-models" packages/ceist/bench/her/vocab -o "$RUNNER_TEMP/her.bundle.json" --graphs "$P/graphs/resource_models"
          .venv/bin/ceist eval --bundle "$RUNNER_TEMP/her.bundle.json" --questions packages/ceist/bench/her/cases.json --config packages/ceist/bench/her/ceist.toml --min-right 80 --max-dangerous 3
      # The same gate with bge-small in the vectors layer (weights from huggingface.co).
      - name: HER acceptance gate, bge-small
        run: |
          .venv/bin/ceist vectors fetch bge-small-en-v1.5
          .venv/bin/ceist vectors embed "$RUNNER_TEMP/her.bundle.json" --config packages/ceist/bench/her/ceist-bge.toml
          .venv/bin/ceist eval --bundle "$RUNNER_TEMP/her.bundle.json" --questions packages/ceist/bench/her/cases.json --config packages/ceist/bench/her/ceist-bge.toml --min-right 84 --max-dangerous 3

  mod:
    name: Mod validate + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Pinned: the mod API is early access and may change between releases.
      # Bump deliberately, together with any mod changes it needs.
      - run: npm install -g @anthropic-ai/claude-code@2.1.311
      - run: claude plugin validate .
      - run: claude plugin test .

  docs:
    name: Doc site builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Strict build: a broken meta file or bad frontmatter in docs/ fails here.
      - run: npm ci
        working-directory: docs-site
      - run: npm run build
        working-directory: docs-site
