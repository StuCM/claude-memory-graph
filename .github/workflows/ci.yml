name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python tests (incl. retrieval benchmark)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest -q

  ceist:
    name: ceist with Arches outputs (Alizarin, Arches Search)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      # Alizarin reads the SKOS thesauri; the Rós Madair end-to-end tests skip
      # without its bindings and emitter (a long Rust build).
      - run: uv venv && uv pip install ./packages/ceist alizarin pytest
      - run: .venv/bin/python -m pytest -q packages/ceist/tests

  mod:
    name: Mod validate + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Pinned: the mod API is early access and may change between releases.
      # Bump deliberately, together with any mod changes it needs.
      - run: npm install -g @anthropic-ai/claude-code@2.1.311
      - run: claude plugin validate .
      - run: claude plugin test .

  docs:
    name: Doc site builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Strict build: a broken meta file or bad frontmatter in docs/ fails here.
      - run: npm ci
        working-directory: docs-site
      - run: npm run build
        working-directory: docs-site
