<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Memory chat</title>
<style>
:root{
  --bg:#f6f5f1; --surface:#ffffff; --ink:#1f1f1c; --muted:#6b6a64; --line:#e3e1da;
  --accent:#2f5d50; --accent-ink:#ffffff; --chip:#eef2ef; --chip-ink:#2f5d50;
  --you:#e9efe9; --err:#b3261e; --code:#f0eee8;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#171716; --surface:#21211f; --ink:#ecebe6; --muted:#a3a19a; --line:#34332f;
  --accent:#6fae98; --accent-ink:#0f1a16; --chip:#22302b; --chip-ink:#9fd0bd;
  --you:#26302b; --err:#f2a49c; --code:#2b2b28;
}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
button,textarea,input{font:inherit;color:inherit}
.app{display:flex;flex-direction:column;height:100%;max-width:46rem;margin:0 auto}
header{display:flex;align-items:center;gap:.5rem;padding:.75rem 1rem;border-bottom:1px solid var(--line)}
header h1{font-size:1.05rem;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ghost{background:none;border:1px solid var(--line);border-radius:.5rem;padding:.35rem .7rem;
  cursor:pointer;font-size:.9rem;color:var(--muted)}
.ghost:hover{color:var(--ink)}
main{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:1rem}
.msg{max-width:100%;overflow-wrap:anywhere}
.you{align-self:flex-end;background:var(--you);padding:.55rem .85rem;border-radius:1rem 1rem .25rem 1rem;
  max-width:85%;white-space:pre-wrap}
.bot p{margin:.4rem 0}.bot ul,.bot ol{margin:.4rem 0;padding-left:1.3rem}
.bot h3,.bot h4{margin:.8rem 0 .3rem;font-size:1rem}
.bot code{background:var(--code);padding:.05rem .3rem;border-radius:.3rem;font-size:.9em}
.bot pre{background:var(--code);padding:.7rem;border-radius:.5rem;overflow-x:auto}
.bot pre code{background:none;padding:0}
.steps{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.35rem}
.chip{background:var(--chip);color:var(--chip-ink);border-radius:999px;padding:.12rem .6rem;font-size:.8rem}
.err{color:var(--err)}
.thinking{color:var(--muted);font-size:.9rem}
.empty{margin:auto 0;color:var(--muted);text-align:center}
.empty h2{color:var(--ink);font-size:1.2rem;margin:.2rem 0 .6rem}
.suggest{display:flex;flex-direction:column;gap:.5rem;margin-top:1rem;align-items:center}
.suggest button{background:var(--surface);border:1px solid var(--line);border-radius:.75rem;
  padding:.55rem .9rem;cursor:pointer;max-width:100%;text-align:left}
form.ask{display:flex;gap:.5rem;padding:.75rem 1rem calc(.75rem + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);background:var(--bg)}
textarea{flex:1;resize:none;border:1px solid var(--line);background:var(--surface);border-radius:.75rem;
  padding:.6rem .8rem;max-height:9rem;min-height:2.75rem}
textarea:focus,input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.send{background:var(--accent);color:var(--accent-ink);border:0;border-radius:.75rem;padding:0 1rem;
  cursor:pointer;font-weight:600}
.send:disabled{opacity:.5;cursor:default}
.login{max-width:22rem;margin:auto;padding:1.5rem 1rem;width:100%}
.login h1{font-size:1.3rem}
.login input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:.6rem;
  padding:.7rem;margin:.5rem 0}
.login button{width:100%;background:var(--accent);color:var(--accent-ink);border:0;border-radius:.6rem;
  padding:.7rem;cursor:pointer;font-weight:600}
.note{color:var(--muted);font-size:.9rem}
a.ghost{text-decoration:none;display:inline-block}
.settings{padding:1rem;display:flex;flex-direction:column;gap:1rem;overflow-y:auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:.75rem;padding:1rem}
.card h2{font-size:1rem;margin:0 0 .3rem}
.card p{margin:.2rem 0 .7rem}
.card ol{margin:.2rem 0 .7rem;padding-left:1.3rem}.card li{margin:.25rem 0}
.card input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:.6rem;
  padding:.6rem;margin:.25rem 0}
.act{background:var(--accent);color:var(--accent-ink);border:0;border-radius:.6rem;padding:.55rem .9rem;
  cursor:pointer;font-weight:600;margin-top:.4rem}
.act.danger{background:var(--err);color:var(--surface)}
.act:disabled{opacity:.5;cursor:default}
.ok{color:var(--accent)}
.secret{font-family:ui-monospace,monospace;background:var(--code);padding:.5rem;border-radius:.4rem;
  overflow-wrap:anywhere;user-select:all;margin:.5rem 0}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const BOOT = /*BOOT*/null;
const app = document.getElementById('app');
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// A small, safe markdown subset: everything is escaped first.
function md(src){
  const blocks = src.split(/```/);
  return blocks.map((part, i) => {
    if (i % 2) return '<pre><code>' + esc(part.replace(/^\w*\n/, '')) + '</code></pre>';
    const lines = esc(part).split('\n'); let out = '', list = null;
    const inline = t => t.replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|\W)\*([^*\n]+)\*(?=\W|$)/g, '$1<em>$2</em>');
    const close = () => { if (list) { out += `</${list}>`; list = null } };
    for (const line of lines){
      let m;
      if ((m = line.match(/^\s*[-*•]\s+(.*)/))) { if (list !== 'ul') { close(); out += '<ul>'; list = 'ul' } out += `<li>${inline(m[1])}</li>`; }
      else if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== 'ol') { close(); out += '<ol>'; list = 'ol' } out += `<li>${inline(m[1])}</li>`; }
      else if ((m = line.match(/^#{1,4}\s+(.*)/))) { close(); out += `<h3>${inline(m[1])}</h3>`; }
      else if (line.trim() === '') { close(); }
      else { close(); out += `<p>${inline(line)}</p>`; }
    }
    close(); return out;
  }).join('');
}

function login(){
  document.title = BOOT.title + ' — sign in';
  app.innerHTML = `<div class="login">
    <h1>${esc(BOOT.title)}</h1>
    <p class="note">Ask questions about what this memory holds. Sign in with the password you were given.</p>
    ${BOOT.error ? `<p class="err">${esc(BOOT.error)}</p>` : ''}
    <form method="post" action="/chat/login">
      <input type="hidden" name="next" value="${esc(BOOT.next || '/')}">
      <input type="password" name="password" placeholder="Password" autocomplete="current-password" autofocus required>
      <button type="submit">Sign in</button>
    </form></div>`;
}

function chat(){
  document.title = BOOT.title;
  app.innerHTML = `<header><h1>${esc(BOOT.title)}</h1>
      <button class="ghost" id="new">New chat</button>
      <a class="ghost" href="/connect">Use in Claude</a>
      <a class="ghost" href="/settings">Settings</a>
      <form method="post" action="/chat/logout"><button class="ghost">Sign out</button></form></header>
    <main id="log"></main>
    <form class="ask" id="ask"><textarea id="q" rows="1" placeholder="Ask about the memory…" enterkeyhint="send"></textarea>
      <button class="send" id="go">Send</button></form>`;
  const log = document.getElementById('log'), q = document.getElementById('q'), go = document.getElementById('go');
  let chatId = crypto.randomUUID(), busy = false;

  function empty(){
    log.innerHTML = `<div class="empty"><h2>What would you like to know?</h2>
      ${BOOT.configured ? '' : '<p class="err">Chat isn’t set up on this server yet: it needs an Anthropic API key (ANTHROPIC_API_KEY).</p>'}
      <div class="suggest">
        <button>Give me an overview of what this memory holds</button>
        <button>What decisions have been made recently, and why?</button>
        <button>What gotchas or known problems should I know about?</button>
      </div></div>`;
    log.querySelectorAll('.suggest button').forEach(b => b.onclick = () => { q.value = b.textContent; ask(); });
  }
  empty();

  document.getElementById('new').onclick = () => { if (!busy) { chatId = crypto.randomUUID(); empty(); q.focus(); } };
  q.addEventListener('input', () => { q.style.height = 'auto'; q.style.height = q.scrollHeight + 'px'; });
  q.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(); } });
  document.getElementById('ask').onsubmit = e => { e.preventDefault(); ask(); };

  async function ask(){
    const text = q.value.trim(); if (!text || busy) return;
    busy = true; go.disabled = true; q.value = ''; q.style.height = 'auto';
    log.querySelector('.empty')?.remove();
    const you = document.createElement('div'); you.className = 'msg you'; you.textContent = text; log.append(you);
    const bot = document.createElement('div'); bot.className = 'msg bot';
    bot.innerHTML = '<div class="steps"></div><div class="body"><span class="thinking">Looking through the memory…</span></div>';
    log.append(bot); log.scrollTop = log.scrollHeight;
    const steps = bot.querySelector('.steps'), body = bot.querySelector('.body');
    let answer = '';
    const fail = msg => { body.innerHTML = md(answer) + `<p class="err">${esc(msg)}</p>`; };
    try {
      const res = await fetch('/chat/send', {method: 'POST', headers: {'Content-Type': 'application/json'},
                                             body: JSON.stringify({chat: chatId, text})});
      if (res.status === 401) { location.reload(); return; }
      if (!res.ok) { fail((await res.json().catch(() => ({}))).error || `Error ${res.status}`); return; }
      const reader = res.body.getReader(), dec = new TextDecoder(); let buf = '';
      for (;;) {
        const {value, done} = await reader.read(); if (done) break;
        buf += dec.decode(value, {stream: true});
        let cut;
        while ((cut = buf.indexOf('\n\n')) >= 0) {
          const line = buf.slice(0, cut); buf = buf.slice(cut + 2);
          if (!line.startsWith('data: ')) continue;
          const ev = JSON.parse(line.slice(6));
          if (ev.type === 'text') { answer += ev.text; body.innerHTML = md(answer); }
          else if (ev.type === 'tool') { const c = document.createElement('span'); c.className = 'chip'; c.textContent = ev.text; steps.append(c); }
          else if (ev.type === 'error') { fail(ev.text); }
          const near = log.scrollHeight - log.scrollTop - log.clientHeight < 120;
          if (near) log.scrollTop = log.scrollHeight;
        }
      }
      if (!answer && !body.querySelector('.err')) body.innerHTML = '<p class="note">(no answer)</p>';
    } catch (e) { fail('Connection lost. Try again.'); }
    finally { busy = false; go.disabled = false; q.focus(); }
  }
  q.focus();
}

function connect(){
  document.title = BOOT.title;
  const url = BOOT.connector;
  app.innerHTML = `<header><h1>${esc(BOOT.title)}</h1>
      ${BOOT.configured ? '<a class="ghost" href="/">Chat here</a>' : ''}
      <a class="ghost" href="/settings">Settings</a></header>
    <div class="settings">
    <div class="card"><h2>Use this memory in your own Claude</h2>
      <p>Add it to Claude as a connector, then ask about it in any chat: on the web, the phone or the desktop app, or in Claude Code. It runs on your own Claude plan.</p>
      ${BOOT.readOnly ? '<p class="note">This memory is read-only: Claude can search and read it, but not change it.</p>' : ''}
      ${url ? `<p class="note">Connector address</p><div class="secret" id="url">${esc(url)}</div>
        <button class="act" id="copy">Copy address</button> <span class="ok" id="copied"></span>`
            : '<p class="err">Apps can’t connect yet: this server needs a public HTTPS address. The owner sets <code>MEMORY_GRAPH_PUBLIC_URL</code>.</p>'}
    </div>
    <div class="card"><h2>claude.ai, the phone and desktop apps</h2>
      <ol>
        <li>In <strong>claude.ai</strong>, open <strong>Settings → Connectors → Add custom connector</strong>.</li>
        <li>Name it (“${esc(BOOT.title)}”) and paste the address above.</li>
        <li>Press <strong>Connect</strong>. This server’s sign-in page opens: enter the password you were given and press <strong>Allow</strong>.</li>
        <li>In a chat, switch it on from the tools menu, then ask, for example: “What does the memory say about…?”</li>
      </ol>
      <p class="note">Connectors added on claude.ai also appear in the phone and desktop apps signed in to the same account.</p></div>
    <div class="card"><h2>Claude Code</h2>
      <div class="secret">claude mcp add --transport http memory ${esc(url || 'https://<this server>/mcp')}</div>
      <p class="note">Then run <code>/mcp</code> in Claude Code, choose this server and authenticate: the same sign-in page opens in your browser.</p></div>
    </div>`;
  const copy = document.getElementById('copy');
  if (copy) copy.onclick = async () => {
    try { await navigator.clipboard.writeText(url); document.getElementById('copied').textContent = 'Copied'; }
    catch (e) { const r = document.createRange(); r.selectNodeContents(document.getElementById('url'));
                getSelection().removeAllRanges(); getSelection().addRange(r); }
  };
}

function settings(){
  document.title = BOOT.title + ' — settings';
  app.innerHTML = `<header><h1>Settings</h1><a class="ghost" href="/">Back to chat</a></header>
    <div class="settings">
    ${BOOT.manageable ? '' : '<p class="err">This server has no token, so its settings can’t be changed here.</p>'}
    <div class="card"><h2>Server token</h2>
      <p class="note">Every change below needs the server token (<code>MEMORY_GRAPH_TOKEN</code>, or the last one made here), so someone with only the chat password can’t change anything.</p>
      <input type="password" id="tok" placeholder="Server token" autocomplete="off"></div>
    <div class="card"><h2>Sign everything out</h2>
      <p class="note">Every browser, and every app connected through claude.ai or the phone, has to sign in again. Claude Code machines use the token and stay connected.</p>
      <button class="act danger" data-act="sign-out-all">Sign everything out</button><div class="out"></div></div>
    <div class="card"><h2>Change the password</h2>
      <p class="note">The password for this chat and for connecting apps. Changing it signs everything out.</p>
      <input type="password" id="pw1" placeholder="New password (at least 8 characters)" autocomplete="new-password">
      <input type="password" id="pw2" placeholder="New password again" autocomplete="new-password">
      <button class="act" data-act="password">Change password</button><div class="out"></div></div>
    <div class="card"><h2>Replace the token</h2>
      <p class="note">For when the token may have leaked. The old one stops working at once; each Claude Code machine needs the new one in its plugin settings (<em>Memory server token</em>).</p>
      <button class="act danger" data-act="token">Replace the token</button><div class="out"></div></div>
    </div>`;
  app.querySelectorAll('[data-act]').forEach(btn => btn.onclick = async () => {
    const out = btn.nextElementSibling, act = btn.dataset.act;
    const token = document.getElementById('tok').value;
    const body = {token};
    if (!token) { out.innerHTML = '<p class="err">Enter the server token first.</p>'; return; }
    if (act === 'password') {
      const a = document.getElementById('pw1').value, b = document.getElementById('pw2').value;
      if (a !== b) { out.innerHTML = '<p class="err">The two passwords don’t match.</p>'; return; }
      body.password = a;
    }
    const ask = {'sign-out-all': 'Sign every browser and app out?', 'token': 'Replace the token? Claude Code machines stop working until they get the new one.'}[act];
    if (ask && !confirm(ask)) return;
    btn.disabled = true; out.innerHTML = '';
    try {
      const res = await fetch('/settings/' + act, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
      const data = await res.json().catch(() => ({}));
      if (res.status === 401) { location.href = '/'; return; }
      if (!res.ok) { out.innerHTML = `<p class="err">${esc(data.error || 'Error ' + res.status)}</p>`; return; }
      out.innerHTML = `<p class="ok">${esc(data.message)}</p>` + (data.token ? `<div class="secret">${esc(data.token)}</div>` : '');
      if (data.token) document.getElementById('tok').value = data.token;
      if (data.signedOut) setTimeout(() => { location.href = '/'; }, 2500);
    } catch (e) { out.innerHTML = '<p class="err">Connection lost.</p>'; }
    finally { btn.disabled = false; }
  });
}

({chat, login, settings, connect}[BOOT.view] || login)();
</script>
</body>
</html>
