# One block per question set. role: regression (must not change), development (tune freely),
# exam (scored only with --exam, each use logged). kind says how bench/run.py collects it:
#   bank        demo/questions.json through starches-demo's ask.answer
#   structural  a generated set ({q, target}) through interpret, as demo/run_bank.py --set
#   reorder     assembly/measure.py's reorder bank, strict mode
#   her         her_plans.py over a HER package, against its reviewed plans
#   testbed     questions run over a record corpus (bench/testbed.py)
#   jsonl       rows already collected
# Sets that omit `python` run in the python that runs run.py. `cwd` is where the runner imports `ask` from.

[demo-bank]
role = "regression"
kind = "bank"
cwd = "/home/stuart/git/personal/starches-demo/ask"
python = ["uv", "run", "python"]

[reorder]
role = "regression"
kind = "reorder"
cwd = "/home/stuart/git/personal/starches-demo/ask"
python = ["uv", "run", "python"]

["her-2.0"]
role = "regression"
kind = "her"
pkg = "/home/stuart/.cache/tmp-003/arches-her/arches_her/pkg"
plans = "her/plans-2.0.json"

