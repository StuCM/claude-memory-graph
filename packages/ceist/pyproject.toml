[project]
name = "ceist"
version = "0.2.0"
description = "Plain-English questions over a graph, without an LLM: question -> backend-neutral plan -> SPARQL / Ros Madair / Arches Search"
requires-python = ">=3.11"
# Alizarin reads Arches data: graph shape, datatypes, tiles as trees, controlled
# lists and thesauri (ceist.arches, ceist.alizarin, ceist vocab describe)
# 2.0.0a141 is newer than 2.0.0b9 (b9 plus 16 commits) but sorts below it
dependencies = ["alizarin==2.0.0a141"]

[project.optional-dependencies]
# static word vectors for the "vectors" matching layer (ceist.vectors)
vectors = [
    "numpy",
    "wordllama>=0.4,<0.5; python_version < '3.14' and (sys_platform == 'darwin' or (sys_platform == 'win32' and platform_machine == 'AMD64') or (sys_platform == 'linux' and platform_machine == 'x86_64'))",
]
# small transformers for the "vectors" layer (ceist.onnx: bge-small, MiniLM)
onnx = ["numpy", "onnxruntime>=1.17", "tokenizers>=0.15"]

[project.scripts]
ceist = "ceist.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ceist"]
