[project]
name = "ceist"
version = "0.1.0"
description = "Plain-English questions over a graph, without an LLM: question -> backend-neutral plan -> SPARQL / Ros Madair / Arches Search"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ceist"]
