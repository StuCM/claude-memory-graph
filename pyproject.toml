[project]
name = "claude-memory-graph"
version = "0.18.0"
description = "Arches-inspired knowledge graph MCP server for Claude Code long-term memory"
requires-python = ">=3.11"
dependencies = [
    "pyoxigraph>=0.4",
    "mcp>=2",
    "anthropic>=1.1",
    # meaning-level matching (gate/semantic.py); only where a prebuilt wheel
    # exists — elsewhere the gate matches words only, as before
    "wordllama>=0.4,<0.5; python_version < '3.14' and (sys_platform == 'darwin' or (sys_platform == 'win32' and platform_machine == 'AMD64') or (sys_platform == 'linux' and platform_machine == 'x86_64'))",
]

[project.scripts]
claude-memory-graph = "claude_memory_graph.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claude_memory_graph"]
